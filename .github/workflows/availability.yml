name: Update availability

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: availability
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build availability.json
        run: python3 scripts/build_availability.py
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          GOOGLE_ICAL_URL: ${{ secrets.GOOGLE_ICAL_URL }}

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain availability.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add availability.json
            git commit -m "Update availability"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to availability.json"
          fi
